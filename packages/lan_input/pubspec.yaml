name: lan_input
description: Native primary-display input bridge for LAN Bridge.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      windows:
        pluginClass: LanInputPluginCApi
      macos:
        pluginClass: LanInputPlugin

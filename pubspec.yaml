name: lan_bridge
description: Share a keyboard and mouse between Windows and macOS over an encrypted LAN connection.
publish_to: none
version: 0.11.3+22
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  crypto: ^3.0.7
  path: ^1.9.1
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  pasteboard: ^0.6.0
  lan_input:
    path: packages/lan_input
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

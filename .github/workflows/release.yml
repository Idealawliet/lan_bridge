name: Build and publish desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Locate or install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build Windows EXE installer and portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-build.log'
          $failed = $false
          try { & ./scripts/build-windows.ps1 *> $log }
          catch { $_ | Out-String | Add-Content $log; $failed = $true }
          Get-Content $log
          '### Windows build diagnostics' | Add-Content $env:GITHUB_STEP_SUMMARY
          '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content $log -Tail 160 | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($failed) {
            $message = (Get-Content $log -Tail 120) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows native build diagnostics::$message"
            exit 1
          }
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist/*-setup-unsigned.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $installer = $installers[0]
          $destination = Join-Path $env:RUNNER_TEMP 'LAN Bridge Smoke'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          foreach ($file in @('lan_bridge.exe', 'flutter_windows.dll', 'data', 'msvcp140.dll', 'unins000.exe')) {
            if (-not (Test-Path (Join-Path $destination $file))) { throw "Missing installed component: $file" }
          }
          $uninstall = Start-Process -FilePath (Join-Path $destination 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
      - name: Build macOS DMG and portable ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          bash scripts/build-macos.sh 2>&1 | tee "$RUNNER_TEMP/macos-build.log"
          result=${PIPESTATUS[0]}
          {
            echo '### macOS build diagnostics'
            echo '```text'
            tail -n 100 "$RUNNER_TEMP/macos-build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Smoke test macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            mount="$RUNNER_TEMP/lan-bridge-dmg"
            mkdir -p "$mount"
            echo 'Mounting DMG'
            hdiutil attach dist/*.dmg -mountpoint "$mount" -nobrowse -readonly
            trap 'hdiutil detach "$mount"' EXIT
            echo 'Checking application executable'
            test -x "$mount/LAN Bridge.app/Contents/MacOS/lan_bridge"
            echo 'Checking Applications shortcut'
            test "$(readlink "$mount/Applications")" = /Applications
            echo 'Verifying application signature integrity'
            codesign --verify --deep --strict --verbose=2 "$mount/LAN Bridge.app"
            echo 'Checking universal architecture'
            lipo -info "$mount/LAN Bridge.app/Contents/MacOS/lan_bridge"
            lipo "$mount/LAN Bridge.app/Contents/MacOS/lan_bridge" -verify_arch arm64 x86_64
          ) 2>&1 | tee "$RUNNER_TEMP/macos-smoke.log"
          result=${PIPESTATUS[0]}
          {
            echo '### macOS installer diagnostics'
            echo '```text'
            tail -n 100 "$RUNNER_TEMP/macos-smoke.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then
            message="$(tail -n 80 "$RUNNER_TEMP/macos-smoke.log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            printf '::error title=macOS installer diagnostics::%s\n' "$message"
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Verify checksums and publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check *.sha256)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease \
            --title "LAN Bridge $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
